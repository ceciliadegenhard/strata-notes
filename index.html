  <div id="file-protocol-warning" style="display:none;position:fixed;top:0;left:0;right:0;background:#c45c26;color:#fff;padding:0.75rem 1rem;font-size:0.9rem;text-align:center;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)">
    <strong>Upload won't work when opened from Desktop.</strong> Run in Terminal: <code style="background:rgba(0,0,0,.2);padding:0.2em 0.4em;border-radius:4px">cd ~/Desktop && python3 -m http.server 8080</code> then open <a href="http://localhost:8080/strata-notes.html" style="color:#fff;text-decoration:underline">http://localhost:8080/strata-notes.html</a> in your browser.
  </div>
  <div id="app"></div>
  <script>
(function() {
if (window.location.protocol === 'file:') {
  document.getElementById('file-protocol-warning').style.display = 'block';
}
const STORAGE_KEY = 'strata-notes-v1';
const PDF_DB = 'strata-pdfs-v1';
const SUPABASE_URL = 'https://ybznljwkatlufrdxujzb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Vo6gPuJ4Iz5js2iVB7cxLA_U3s7fHf3';
const SUPABASE_NOTES_TABLE = 'strata_notes';
const SUPABASE_PDF_BUCKET = 'strata_pdfs';

function openPdfDb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(PDF_DB, 1);
    r.onerror = () => reject(r.error);
    r.onsuccess = () => resolve(r.result);
    r.onupgradeneeded = e => e.target.result.createObjectStore('pdfs', { keyPath: 'id' });
  });
}
async function putPdf(noteId, blob) {
  const db = await openPdfDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('pdfs', 'readwrite');
    tx.objectStore('pdfs').put({ id: noteId, blob });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getLocalPdf(noteId) {
  const db = await openPdfDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('pdfs', 'readonly');
    const r = tx.objectStore('pdfs').get(noteId);
    r.onsuccess = () => resolve(r.result?.blob ?? null);
    r.onerror = () => reject(tx.error);
  });
}
async function deletePdf(noteId) {
  const db = await openPdfDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('pdfs', 'readwrite');
    tx.objectStore('pdfs').delete(noteId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

let supabaseClientPromise = null;
let cloudSyncTimer = null;
let cloudSyncInFlight = false;
let cloudSyncQueued = false;
let cloudBootstrapComplete = false;
let cloudErrorNoticeShown = false;
const cloudEnabled = Boolean(SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY);

function cloudSetupInstructions() {
  return `Cloud sync setup needed in Supabase:
1) Create table "${SUPABASE_NOTES_TABLE}" with columns:
   id text primary key,
   title text,
   body text,
   domain text,
   class_name text,
   era text,
   location text,
   subject text,
   tags jsonb,
   has_pdf boolean,
   search_text text,
   note_date date,
   updated_at timestamptz,
   pdf_path text
2) Enable RLS on the table and add policies allowing select/insert/update/delete.
3) Create public bucket "${SUPABASE_PDF_BUCKET}" and storage policies allowing select/insert/update/delete.`;
}

function showCloudErrorOnce(err) {
  if (cloudErrorNoticeShown) return;
  cloudErrorNoticeShown = true;
  const msg = err?.message ? String(err.message) : String(err || 'Unknown cloud error');
  alert(`Cloud sync is not ready yet.\n\n${msg}\n\n${cloudSetupInstructions()}`);
}

async function getSupabaseClient() {
  if (!cloudEnabled) return null;
  if (!supabaseClientPromise) {
    supabaseClientPromise = (async () => {
      const supabaseModule = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
      return supabaseModule.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false,
        },
      });
    })();
  }
  return supabaseClientPromise;
}

function toCloudRow(note) {
  return {
    id: String(note.id),
    title: String(note.title || ''),
    body: String(note.body || ''),
    domain: String(note.domain || 'general'),
    class_name: String(note.class || ''),
    era: String(note.era || ''),
    location: String(note.location || ''),
    subject: String(note.subject || ''),
    tags: Array.isArray(note.tags) ? note.tags : [],
    has_pdf: Boolean(note.hasPdf),
    search_text: String(note.searchText || ''),
    note_date: note.noteDate || null,
    updated_at: note.updatedAt || new Date().toISOString(),
    pdf_path: note.hasPdf ? `notes/${note.id}.pdf` : null,
  };
}

function fromCloudRow(row) {
  return migrateNote({
    id: row.id,
    title: row.title,
    body: row.body,
    domain: row.domain,
    class: row.class_name,
    era: row.era,
    location: row.location,
    subject: row.subject,
    tags: Array.isArray(row.tags) ? row.tags : [],
    hasPdf: Boolean(row.has_pdf),
    searchText: row.search_text || '',
    noteDate: row.note_date || '',
    updatedAt: row.updated_at || new Date().toISOString(),
  });
}

async function uploadPdfToCloud(noteId, blob) {
  const supabase = await getSupabaseClient();
  if (!supabase || !blob) return;
  const path = `notes/${noteId}.pdf`;
  const { error } = await supabase.storage
    .from(SUPABASE_PDF_BUCKET)
    .upload(path, blob, { upsert: true, contentType: 'application/pdf' });
  if (error) throw error;
}

async function downloadPdfFromCloud(noteId) {
  const supabase = await getSupabaseClient();
  if (!supabase) return null;
  const path = `notes/${noteId}.pdf`;
  const { data, error } = await supabase.storage.from(SUPABASE_PDF_BUCKET).download(path);
  if (error) return null;
  return data || null;
}

async function deletePdfFromCloud(noteId) {
  const supabase = await getSupabaseClient();
  if (!supabase) return;
  const path = `notes/${noteId}.pdf`;
  await supabase.storage.from(SUPABASE_PDF_BUCKET).remove([path]);
}

async function getPdf(noteId) {
  let blob = await getLocalPdf(noteId);
  if (blob) return blob;
  if (!cloudEnabled) return null;
  try {
    blob = await downloadPdfFromCloud(noteId);
    if (blob) await putPdf(noteId, blob);
    return blob;
  } catch {
    return null;
  }
}

async function upsertNotesToCloud(noteList) {
  const supabase = await getSupabaseClient();
  if (!supabase) return;
  const rows = noteList.map(toCloudRow);
  const { error } = await supabase.from(SUPABASE_NOTES_TABLE).upsert(rows, { onConflict: 'id' });
  if (error) throw error;
}

async function deleteNoteFromCloud(noteId) {
  const supabase = await getSupabaseClient();
  if (!supabase) return;
  const { error } = await supabase.from(SUPABASE_NOTES_TABLE).delete().eq('id', noteId);
  if (error) throw error;
}

async function syncCloudNow() {
  if (!cloudEnabled) return;
  if (cloudSyncInFlight) {
    cloudSyncQueued = true;
    return;
  }
  cloudSyncInFlight = true;
  try {
    await upsertNotesToCloud(notes);
    for (const n of notes) {
      if (!n.hasPdf) continue;
      const localBlob = await getLocalPdf(n.id);
      if (!localBlob) continue;
      await uploadPdfToCloud(n.id, localBlob);
    }
  } catch (err) {
    showCloudErrorOnce(err);
  } finally {
    cloudSyncInFlight = false;
    if (cloudSyncQueued) {
      cloudSyncQueued = false;
      void syncCloudNow();
    }
  }
}

function scheduleCloudSync() {
  if (!cloudEnabled || !cloudBootstrapComplete) return;
  if (cloudSyncTimer) clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(() => {
    cloudSyncTimer = null;
    void syncCloudNow();
  }, 900);
}

async function bootstrapCloudNotes() {
  if (!cloudEnabled || cloudBootstrapComplete) return;
  try {
    const supabase = await getSupabaseClient();
    if (!supabase) return;
    const { data, error } = await supabase.from(SUPABASE_NOTES_TABLE).select('*').order('updated_at', { ascending: false });
    if (error) throw error;
    if (Array.isArray(data) && data.length > 0) {
      notes = data.map(fromCloudRow);
      saveNotes(notes, { skipCloud: true });
      selectedId = notes[0]?.id ?? null;
      render();
    } else if (notes.length > 0) {
      await upsertNotesToCloud(notes);
      for (const n of notes) {
        if (!n.hasPdf) continue;
        const localBlob = await getLocalPdf(n.id);
        if (!localBlob) continue;
        await uploadPdfToCloud(n.id, localBlob);
      }
    }
  } catch (err) {
    showCloudErrorOnce(err);
  } finally {
    cloudBootstrapComplete = true;
  }
}

function uid() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
}

function loadNotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) return [];
    return data.map(migrateNote);
  } catch {
    return [];
  }
}

function migrateNote(n) {
  const legacy = typeof n.context === 'string' ? n.context : '';
  const updated = typeof n.updatedAt === 'string' ? n.updatedAt : new Date().toISOString();
  const defaultDate = updated.slice(0, 10);
  return {
    ...n,
    id: String(n.id ?? uid()),
    title: String(n.title ?? ''),
    body: String(n.body ?? ''),
    domain: ['history', 'geoscience', 'general'].includes(String(n.domain)) ? n.domain : 'general',
    class: typeof n.class === 'string' ? n.class : '',
    era: typeof n.era === 'string' ? n.era : (n.domain === 'history' ? legacy : ''),
    location: typeof n.location === 'string' ? n.location : '',
    subject: typeof n.subject === 'string' ? n.subject : (n.domain === 'geoscience' ? legacy : ''),
    tags: Array.isArray(n.tags) ? n.tags.filter(t => typeof t === 'string').map(t => t.trim()).filter(Boolean) : [],
    hasPdf: Boolean(n.hasPdf),
    searchText: typeof n.searchText === 'string' ? n.searchText : '',
    noteDate: typeof n.noteDate === 'string' ? n.noteDate : defaultDate,
    updatedAt: updated,
  };
}

function parseTags(s) {
  return (s || '').split(/[,;]+/).map(t => t.trim()).filter(Boolean);

function formatTags(tags) {

function parseEraYear(era) {
  const m = String(era || '').match(/\b(1[0-9]{3}|2[0-9]{3})\b/);
  return m ? parseInt(m[1], 10) : 9999;
}
function parseNoteDateValue(note) {
  const v = String(note?.noteDate || '');
  return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '9999-12-31';
}

function sortNotes(list) {
  return [...list].sort((a, b) => {
    if (filterDomain === 'history') {
      const dateA = parseNoteDateValue(a);
      const dateB = parseNoteDateValue(b);
      if (dateA !== dateB) return dateA.localeCompare(dateB);
      const eraA = parseEraYear(a.era);
      const eraB = parseEraYear(b.era);
      if (eraA !== eraB) return eraA - eraB;
      const loc = (a.location || '').localeCompare(b.location || '', undefined, { sensitivity: 'base' });
      if (loc !== 0) return loc;
      return (a.class || '').localeCompare(b.class || '', undefined, { sensitivity: 'base' });
    }
    if (filterDomain === 'geoscience') {
      const sub = (a.subject || '').localeCompare(b.subject || '', undefined, { sensitivity: 'base' });
      if (sub !== 0) return sub;
      return (a.class || '').localeCompare(b.class || '', undefined, { sensitivity: 'base' });
    }
    const classCmp = (a.class || '').localeCompare(b.class || '', undefined, { sensitivity: 'base' });
    if (classCmp !== 0) return classCmp;
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  });
}

function filteredNotes() {
  let list = notes;
  if (filterDomain !== 'all') list = list.filter(n => n.domain === filterDomain);
  if (filterClass) list = list.filter(n => (n.class || '').toLowerCase().includes(filterClass.toLowerCase()));
  if (filterDomain === 'history' && filterEra) list = list.filter(n => (n.era || '').toLowerCase().includes(filterEra.toLowerCase()));
  if (filterDomain === 'history' && filterLocation) list = list.filter(n => (n.location || '').toLowerCase().includes(filterLocation.toLowerCase()));
  if (filterDomain === 'geoscience' && filterSubject) list = list.filter(n => (n.subject || '').toLowerCase().includes(filterSubject.toLowerCase()));
  if (filterNoteDate) list = list.filter(n => (n.noteDate || '') === filterNoteDate);
  const q = searchQuery.trim().toLowerCase();
  if (q) list = list.filter(n => { const tagsStr = (n.tags || []).join(' '); const body = n.searchText || n.body || ''; return `${n.title}\n${body}\n${n.class}\n${n.era}\n${n.location}\n${n.subject}\n${tagsStr}`.toLowerCase().includes(q); });
  return sortNotes(list);
}
function globalSearchNotes(q) {
  const query = String(q || '').trim().toLowerCase();
  if (!query) return [];
  const domainLabel = { history: 'History', geoscience: 'Geoscience', general: 'Misc' };
  return [...notes]
    .filter(n => {
      const tagsStr = (n.tags || []).join(' ');
      const body = n.searchText || n.body || '';
      const hay = `${n.title}\n${body}\n${n.class}\n${n.era}\n${n.location}\n${n.subject}\n${n.noteDate}\n${tagsStr}\n${domainLabel[n.domain] || ''}`.toLowerCase();
      return hay.includes(query);
    })
    .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
}

const DEFAULT_CLASSES = { history: ['Issues in European History II (HIS 1120)'], geoscience: ['Earth Revealed (GEO 1600)'], general: [] };
const CUSTOM_CLASSES_KEY = 'strata-custom-classes-v1';
function loadCustomClasses() {
  try {
    const raw = localStorage.getItem(CUSTOM_CLASSES_KEY);
    if (!raw) return { history: [], geoscience: [], general: [] };
    const data = JSON.parse(raw);
    return { history: data.history || [], geoscience: data.geoscience || [], general: data.general || [] };
  } catch { return { history: [], geoscience: [], general: [] }; }
}
function buildClassLabel(name, code, emoji, year) {
  const n = String(name || '').trim();
  const c = String(code || '').trim();
  if (!n) return '';
  const e = String(emoji || '').trim();
  const y = String(year || '').trim();
  const base = c ? `${n} (${c.toUpperCase()})` : n;
  const withEmoji = e ? `${e} ${base}` : base;
  return y ? `${withEmoji} [${y}]` : withEmoji;
}
function splitClassLabel(label) {
  const raw = String(label || '').trim();
  const emojiMatch = raw.match(/^(\p{Extended_Pictographic}(?:\uFE0F)?)(?:\s+)?(.*)$/u);
  const emoji = emojiMatch ? emojiMatch[1] : '';
  const rest = (emojiMatch ? emojiMatch[2] : raw).trim();
  const yearMatch = rest.match(/\[([^\]]+)\]\s*$/);
  const year = (yearMatch?.[1] || '').trim();
  const restWithoutYear = (yearMatch ? rest.slice(0, yearMatch.index) : rest).trim();
  const m = restWithoutYear.match(/^(.*?)(?:\s*\(([^()]+)\))?$/);
  const name = (m?.[1] || restWithoutYear).trim();
  const code = (m?.[2] || '').trim();
  return { emoji, name: name || restWithoutYear, code, year };
}
function classLabelHtml(label) {
  const parts = splitClassLabel(label);
  return `<span class="class-title">${parts.emoji ? `${escapeHtml(parts.emoji)} ` : ''}${escapeHtml(parts.name)}</span>${parts.code ? `<span class="class-code">${escapeHtml(parts.code)}</span>` : ''}${parts.year ? `<span class="class-year">${escapeHtml(parts.year)}</span>` : ''}`;
}
function classLabelKey(label) {
  const p = splitClassLabel(label);
  return `${String(p.emoji || '').toLowerCase()}|${String(p.name || '').toLowerCase()}|${String(p.code || '').toUpperCase()}|${String(p.year || '').toLowerCase()}`;
}
function addCustomClass(domain, name) {
  const custom = loadCustomClasses();
  const trimmed = String(name || '').trim();
  if (!trimmed) return;
  const arr = custom[domain] || [];
  if (!arr.includes(trimmed)) { arr.push(trimmed); arr.sort((a, b) => a.localeCompare(b)); custom[domain] = arr; localStorage.setItem(CUSTOM_CLASSES_KEY, JSON.stringify(custom)); }
}
function removeCustomClass(domain, name) {
  const custom = loadCustomClasses();
  const arr = (custom[domain] || []).filter(c => c !== name);
  custom[domain] = arr;
  localStorage.setItem(CUSTOM_CLASSES_KEY, JSON.stringify(custom));
}
function uniqueValues(key, domain = 'all') {
  const seen = new Set();
  notes.forEach(n => {
    if (domain !== 'all' && n.domain !== domain) return;
    const v = (n[key] || '').trim();
    if (v) seen.add(v);
  });
  return [...seen].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
}

function allTags() {
  const seen = new Set();
  notes.forEach(n => (n.tags || []).forEach(t => t && seen.add(t)));
  return [...seen].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
}

function classesForDomain(domain) {
  const fromNotes = uniqueValues('class', domain);
  const defaults = DEFAULT_CLASSES[domain] || [];
  const custom = loadCustomClasses()[domain] || [];
  const merged = [...defaults, ...custom, ...fromNotes];
  const deduped = new Map();
  merged.forEach((c) => {
    const v = String(c || '').trim();
    if (!v) return;
    const key = classLabelKey(v);
    if (!deduped.has(key)) deduped.set(key, v);
  });
  return [...deduped.values()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
}

function selectedNote() {
  return notes.find(n => n.id === selectedId) ?? null;

function upsertNote(patch) {
  const i = notes.findIndex(n => n.id === patch.id);
  const now = new Date().toISOString();
  const defaults = { class: '', era: '', location: '', subject: '', tags: [], noteDate: '' };
  if (i === -1) {
    notes.push({ id: patch.id, title: patch.title ?? 'Untitled', body: patch.body ?? '', domain: patch.domain ?? 'general', ...defaults, ...patch, updatedAt: now });
  } else {
    notes[i] = { ...notes[i], ...patch, updatedAt: now };
  }
  saveNotes(notes);
}

async function deleteNote(id) {
  const hadPdf = notes.find(n => n.id === id)?.hasPdf;
  notes = notes.filter(n => n.id !== id);
  saveNotes(notes);
  if (hadPdf) await deletePdf(id);
  if (hadPdf) await deletePdfFromCloud(id).catch(() => {});
  await deleteNoteFromCloud(id).catch(() => {});
  if (selectedId === id) selectedId = filteredNotes()[0]?.id ?? null;
}

async function buildExportPayload() {
  const toExport = await Promise.all(notes.map(async n => {
    const out = { ...n };
    if (n.hasPdf) {
      const pdfBlob = await getPdf(n.id);
      if (pdfBlob) out.pdfBase64 = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result).split(',')[1]); r.onerror = reject; r.readAsDataURL(pdfBlob); });
    }
    return out;
  }));
  return JSON.stringify(toExport, null, 2);
}

async function exportJson(filenamePrefix = 'strata-notes') {
  const payload = await buildExportPayload();
  const blob = new Blob([payload], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${filenamePrefix}-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function saveBackupToChosenFile() {
  const filename = `strata-notes-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const payload = await buildExportPayload();

async function importJson(file) {
  const raw = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result)); r.onerror = reject; r.readAsText(file); });
  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) throw new Error('Invalid file');
    const valid = data.every(x => x && typeof x === 'object' && (typeof x.title === 'string' || x.title == null));
    if (!valid) throw new Error('Invalid file');
    notes = [];
    for (const n of data) {
      const migrated = migrateNote(n);
      const pdfBase64 = n.pdfBase64;
      if (pdfBase64 && typeof pdfBase64 === 'string') {
        const bin = atob(pdfBase64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        await putPdf(migrated.id, new Blob([bytes], { type: 'application/pdf' }));
      }
      delete migrated.pdfBase64;
      notes.push(migrated);
    }
    saveNotes(notes);
    selectedId = notes[0]?.id ?? null;
    render();
  } catch {
    alert('Could not import that file. Use a JSON export from Strata.');
  }
}

let pdfjsLibPromise = null;
async function getPdfJs() {
  if (!pdfjsLibPromise) {
    pdfjsLibPromise = (async () => {
      const lib = await import('https://mozilla.github.io/pdf.js/build/pdf.mjs');
      lib.GlobalWorkerOptions.workerSrc = 'https://mozilla.github.io/pdf.js/build/pdf.worker.mjs';
      return lib;
    })();
  }
  return pdfjsLibPromise;
}
async function extractTextFromPdf(file) {
  const pdfjsLib = await getPdfJs();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
  let fullText = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    fullText += textContent.items.map(item => item.str).join(' ') + '\n\n';
  }
  return fullText.trim();
}
const STOP_WORDS = new Set('a an and are as at be but by for from has he her his if in is it not of on or that the they to was were will with'.split(' '));
function extractTagsFromText(text, maxTags = 8) {
  const words = text.toLowerCase().replace(/[^\w\s'-]/g,' ').split(/\s+/).filter(w=>w.length>=3&&w.length<=40&&!/^\d+$/.test(w)&&!STOP_WORDS.has(w));
  const count = new Map();
  words.forEach(w=>count.set(w,(count.get(w)||0)+1));
  return [...count.entries()].sort((a,b)=>b[1]-a[1]).slice(0,maxTags).map(([w])=>w.replace(/^['"-]+|['"-]+$/g,'')).filter(w=>w.length>=3);
}
async function importFromFiles(files, customTitles) {
  if (!files?.length) return;
  const domain = (pendingUploadFromView || view) === 'app' ? filterDomain : filterDomain !== 'all' ? filterDomain : 'general';
  const targetClass = filterClass;
  const accepted = [].filter.call(files, f => /\.(txt|md|markdown|pdf)$/i.test(f.name));
  if (accepted.length === 0) { alert('Please select .txt, .md, or .pdf files.'); return; }
  const newNotes = [];
  for (let i = 0; i < accepted.length; i++) {
    const file = accepted[i];
    const baseName = file.name.replace(/\.[^.]+$/, '');
    const title = (customTitles && customTitles[i] != null && String(customTitles[i]).trim()) ? String(customTitles[i]).trim() : (baseName || 'Untitled');
    let content = '';
    let tags = [];
    if (/\.pdf$/i.test(file.name)) {
      const noteId = uid();
      await putPdf(noteId, file);
      let searchText = '';
      try {
        const extractedText = await extractTextFromPdf(file);
        if (extractedText && !extractedText.startsWith('[')) { tags = extractTagsFromText(extractedText); searchText = extractedText; }
      } catch {}
      newNotes.push({ id: noteId, title, body: '', domain: domain === 'all' ? 'general' : domain, class: targetClass, era: '', location: '', subject: '', tags, hasPdf: true, searchText, noteDate: new Date().toISOString().slice(0, 10), updatedAt: new Date().toISOString() });
      continue;
    }
    content = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result)); reader.onerror = reject; reader.readAsText(file); });
    if (content) tags = extractTagsFromText(content);
    newNotes.push({ id: uid(), title, body: content, domain: domain === 'all' ? 'general' : domain, class: targetClass, era: '', location: '', subject: '', tags, noteDate: new Date().toISOString().slice(0, 10), updatedAt: new Date().toISOString() });
  }
  notes.push(...newNotes);
  saveNotes(notes);
  selectedId = newNotes[newNotes.length - 1]?.id ?? null;
  const fromStart = pendingUploadFromView === 'start' || view === 'start';
  pendingUploadFiles = [];
  pendingUploadFromView = null;
  if (fromStart) { filterDomain = domain === 'all' ? 'general' : domain; }
  view = 'note-detail';
  render();
}

function escapeHtml(s) {

function escapeAttr(s) {

    });
    document.getElementById('nav-back')?.addEventListener('click', () => {
      goBackByHierarchy();
      render();
    });
  }
  if (!menu) {
    menu = document.createElement('div');
    menu.id = 'global-side-menu';
    menu.className = 'global-side-menu';
    menu.innerHTML = `
      <button type="button" class="btn btn-ghost" id="menu-settings">Settings</button>
      <button type="button" class="btn btn-ghost" id="menu-backup">Save backup</button>
      <button type="button" class="btn btn-ghost" id="menu-import">Import backup</button>
      <button type="button" class="btn btn-primary" id="menu-upload">Upload notes</button>
    `;
    document.body.appendChild(menu);
    document.getElementById('menu-settings')?.addEventListener('click', () => {
      settingsFromView = view === 'app' ? 'app' : 'start';
      view = 'settings';
      render();
    });
    document.getElementById('menu-backup')?.addEventListener('click', async () => {
      await saveBackupToChosenFile();
    });
    document.getElementById('menu-import')?.addEventListener('click', () => {
      document.getElementById('global-import-file')?.click();
    });
    document.getElementById('menu-upload')?.addEventListener('click', () => {
      document.getElementById('global-upload-files')?.click();
    });
  }
  const backBtn = document.getElementById('nav-back');
  if (backBtn) backBtn.disabled = view === 'start';
  if (!input) {
    input = document.createElement('input');
    input.id = 'global-upload-files';
    input.type = 'file';
    input.className = 'hidden-input';
    input.accept = '.txt,.md,.markdown,.pdf,text/plain,text/markdown,application/pdf';
    input.multiple = true;
    input.addEventListener('change', e => {
      const files = [].filter.call(e.target.files || [], f => /\.(txt|md|markdown|pdf)$/i.test(f.name));
      if (files.length === 0) { e.target.value = ''; return; }
      pendingUploadFiles = files;
      pendingUploadFromView = view === 'app' ? 'app' : 'start';
      view = 'upload-preview';
      e.target.value = '';
      render();
    });
    document.body.appendChild(input);
  }
  if (!importInput) {
    importInput = document.createElement('input');
    importInput.id = 'global-import-file';
    importInput.type = 'file';
    importInput.className = 'hidden-input';
    importInput.accept = 'application/json,.json';
    importInput.addEventListener('change', async e => {
      const f = e.target.files?.[0];
      if (f) await importJson(f);
      e.target.value = '';
    });
    document.body.appendChild(importInput);
  }
}

          <div class="pick-actions">
            <button type="button" class="btn btn-primary" id="upload-confirm">Upload notes</button>
            <button type="button" class="btn btn-ghost" id="upload-cancel">Cancel</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('upload-confirm')?.addEventListener('click', async () => {
      const titles = pendingUploadFiles.map((_, i) => (document.getElementById(`upload-title-${i}`)?.value || '').trim());
      try {
        await importFromFiles(pendingUploadFiles, titles);
      } catch (err) { alert('Upload failed: ' + (err.message || err)); }
    });
    document.getElementById('upload-cancel')?.addEventListener('click', () => {
      pendingUploadFiles = [];
      view = pendingUploadFromView || 'start';
      pendingUploadFromView = null;
      render();
    });
    return;
  }

  if (view === 'app') {
    if (!selectedId && notes.length) selectedId = notes[0].id;
    view = selectedId ? 'note-detail' : 'start';
    render();
    return;
  }

  const list = filteredNotes();
  const current = selectedNote();

  if (selectedId && !notes.some(n => n.id === selectedId)) selectedId = list[0]?.id ?? null;
  if (!selectedId && list.length) selectedId = list[0].id;

  const domainLabel = { history: 'History', geoscience: 'Geoscience', general: 'General' };
  const classes = filterDomain === 'history' ? classesForDomain('history') : filterDomain === 'geoscience' ? classesForDomain('geoscience') : [...new Set([...(DEFAULT_CLASSES.history||[]), ...(DEFAULT_CLASSES.geoscience||[]), ...(DEFAULT_CLASSES.general||[]), ...uniqueValues('class')])].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  const locations = uniqueValues('location');
  const subjects = uniqueValues('subject');

  app.innerHTML = `
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand brand-clickable" id="go-home">
          <h1>Strata</h1>
          <p>Notes for History, Earth, and everything between.</p>
          <div class="strata-strip" aria-hidden="true"><span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span><span class="s5"></span></div>
        </div>
        <div class="search-wrap"><input type="search" id="q" placeholder="Search notes…" value="${escapeAttr(searchQuery)}" autocomplete="off" /></div>
        <div>
          <p class="filter-label">Domain</p>
          <div class="domain-filters" role="group" aria-label="Filter by domain">
            ${['all','history','geoscience','general'].map(d => `<button type="button" class="${filterDomain===d?'active':''}" data-domain="${d}">${d==='all'?'All':domainLabel[d]}</button>`).join('')}
          </div>
        </div>
        <div>
          <p class="filter-label">Class</p>
          <input type="text" id="filter-class" class="filter-input" list="datalist-class" placeholder="Filter by class…" value="${escapeAttr(filterClass)}" autocomplete="off" />
          <datalist id="datalist-class">${classes.map(c => `<option value="${escapeAttr(c)}">`).join('')}</datalist>
        </div>
        <div>
          <p class="filter-label">Date of notes taken</p>
          <input type="date" id="filter-note-date" class="filter-input" value="${escapeAttr(filterNoteDate)}" />
        </div>
        ${filterDomain === 'history' ? `<div><p class="filter-label">Time</p><input type="text" id="filter-era" class="filter-input" list="datalist-era" placeholder="Filter by time…" value="${escapeAttr(filterEra)}" autocomplete="off" /><datalist id="datalist-era">${uniqueValues('era','history').map(e=>`<option value="${escapeAttr(e)}">`).join('')}</datalist></div><div><p class="filter-label">Location</p><input type="text" id="filter-location" class="filter-input" list="datalist-location" placeholder="Filter by location…" value="${escapeAttr(filterLocation)}" autocomplete="off" /><datalist id="datalist-location">${locations.map(loc => `<option value="${escapeAttr(loc)}">`).join('')}</datalist></div>` : ''}
        ${filterDomain === 'geoscience' ? `<div><p class="filter-label">Subject / Chapter</p><input type="text" id="filter-subject" class="filter-input" list="datalist-subject" placeholder="Filter by subject…" value="${escapeAttr(filterSubject)}" autocomplete="off" /><datalist id="datalist-subject">${subjects.map(s => `<option value="${escapeAttr(s)}">`).join('')}</datalist></div>` : ''}
        <ul class="note-list" id="note-list">
          ${list.length === 0 ? '<li class="empty-state">No notes match. Try another filter or search.</li>' : list.map(n => {
            const active = n.id === selectedId ? 'active' : '';
            const preview = n.hasPdf ? '(PDF)' : n.body.replace(/\s+/g,' ').trim().slice(0,72);
            const metaParts = [`<span class="badge ${n.domain}">${domainLabel[n.domain]}</span>`, n.noteDate ? `<span>${escapeHtml(formatNoteDate(n.noteDate))}</span>` : '', n.class ? `<span>${escapeHtml(n.class)}</span>` : '', n.domain === 'history' && (n.era || n.location) ? `<span>${escapeHtml([n.era,n.location].filter(Boolean).join(' · '))}</span>` : '', n.domain === 'geoscience' && n.subject ? `<span>${escapeHtml(n.subject)}</span>` : '', (n.tags||[]).length ? `<span class="tags-inline">${(n.tags||[]).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</span>` : '', preview ? `<span class="preview">${escapeHtml(preview)}${!n.hasPdf&&n.body.length>72?'…':''}</span>` : ''].filter(Boolean);
            return `<li><button type="button" class="${active}" data-id="${escapeAttr(n.id)}"><span class="title">${escapeHtml(n.title||'Untitled')}</span><span class="meta">${metaParts.join(' · ')}</span></button></li>`;
          }).join('')}
        </ul>
        <div class="sidebar-actions">
          <button type="button" class="btn btn-primary" id="upload-notes">Upload notes</button>
          <button type="button" class="btn btn-ghost" id="new-note">New note</button>
          <button type="button" class="btn btn-ghost" id="export">Export JSON</button>
          <button type="button" class="btn btn-ghost" id="import">Import JSON</button>
          <button type="button" class="btn btn-ghost" id="open-settings-sidebar">Settings</button>
          <input type="file" id="upload-files" class="hidden-input" accept=".txt,.md,.markdown,.pdf,text/plain,text/markdown,application/pdf" multiple />
          <input type="file" id="import-file" class="hidden-input" accept="application/json,.json" />
        </div>
      </aside>
      <main class="main">
        ${!current ? '<p class="empty-state">Create a note to get started, or import a backup.</p>' : `
          <div class="editor-header">
            <input class="title-input" id="title" type="text" value="${escapeAttr(current.title)}" placeholder="Title" ${!editorEditing?'readonly':''} />
            <div class="editor-actions">
              <button type="button" class="btn btn-ghost" id="editor-edit">${editorEditing ? 'Done' : 'Edit'}</button>
              ${editorEditing ? '<button type="button" class="btn btn-primary" id="editor-save">Save</button>' : ''}
              <button type="button" class="btn btn-danger" id="del">Delete</button>
            </div>
          </div>
          <div class="meta-grid">
            <div class="field"><label for="domain">Domain</label><select id="domain" ${!editorEditing?'disabled':''}><option value="history" ${current.domain==='history'?'selected':''}>History</option><option value="geoscience" ${current.domain==='geoscience'?'selected':''}>Geoscience</option><option value="general" ${current.domain==='general'?'selected':''}>General</option></select></div>
            <div class="field"><label for="note-class">Class</label><select id="note-class" ${!editorEditing?'disabled':''}>${[...new Set([...(classes||[]), current.class||''])].filter(Boolean).map(c=>`<option value="${escapeAttr(c)}" ${c===current.class?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div>
            ${current.domain === 'history' ? `<div class="field"><label for="era">Era</label><input type="text" id="era" value="${escapeAttr(current.era)}" placeholder="e.g. 1350, Medieval, Early Modern" list="datalist-era" ${!editorEditing?'readonly':''} /><datalist id="datalist-era">${uniqueValues('era').map(e=>`<option value="${escapeAttr(e)}">`).join('')}</datalist></div><div class="field"><label for="location">Location</label><input type="text" id="location" value="${escapeAttr(current.location)}" placeholder="e.g. France, Venice, Oxford" list="datalist-editor-location" ${!editorEditing?'readonly':''} /><datalist id="datalist-editor-location">${locations.map(loc=>`<option value="${escapeAttr(loc)}">`).join('')}</datalist></div>` : ''}
            ${current.domain === 'geoscience' ? `<div class="field"><label for="subject">Subject / Chapter</label><input type="text" id="subject" value="${escapeAttr(current.subject)}" placeholder="e.g. Petrology, Ch. 3" list="datalist-editor-subject" ${!editorEditing?'readonly':''} /><datalist id="datalist-editor-subject">${subjects.map(s=>`<option value="${escapeAttr(s)}">`).join('')}</datalist></div>` : ''}
            <div class="field field-tags"><label for="tags">Tags</label><input type="text" id="tags" value="${escapeAttr(formatTags(current.tags))}" placeholder="e.g. primary-source, exam-review (comma-separated)" list="datalist-tags" ${!editorEditing?'readonly':''} /><datalist id="datalist-tags">${allTags().map(t=>`<option value="${escapeAttr(t)}">`).join('')}</datalist></div>
            <div class="field"><label for="note-date">Date taken</label><input type="date" id="note-date" value="${escapeAttr(current.noteDate || '')}" ${!editorEditing?'readonly':''} /></div>
          </div>
          ${current.hasPdf ? `<div class="pdf-viewer-wrap" id="pdf-viewer-wrap"><div class="pdf-loading" id="pdf-loading">Loading PDF…</div><embed id="pdf-embed" class="pdf-embed" type="application/pdf" style="display:none" /></div>` : `<textarea class="body-input" id="body" placeholder="Write here — ideas, citations, sketches, questions…" ${!editorEditing?'readonly':''}></textarea>`}
          <p class="saved-hint">${saveFlash ? 'Saved.' : `Last updated ${formatDate(current.updatedAt)}`}</p>
        `}
      </main>
    </div>
  `;

  document.getElementById('upload-notes')?.addEventListener('click', () => document.getElementById('upload-files')?.click());
  document.getElementById('upload-files')?.addEventListener('change', e => {
    const files = [].filter.call(e.target.files || [], f => /\.(txt|md|markdown|pdf)$/i.test(f.name));
    if (files.length === 0) { alert('Please select .txt, .md, or .pdf files.'); e.target.value = ''; return; }
    pendingUploadFiles = files;
    pendingUploadFromView = 'app';
    view = 'upload-preview';
    e.target.value = '';
    render();
  });
  document.getElementById('go-home')?.addEventListener('click', () => { view = 'start'; render(); });
  document.getElementById('open-settings-sidebar')?.addEventListener('click', () => { settingsFromView = 'app'; view = 'settings'; render(); });
  document.getElementById('q')?.addEventListener('input', e => { searchQuery = e.target.value; rerenderWithInputFocus('q', e.target.selectionStart); });
  document.getElementById('filter-era')?.addEventListener('input', e => { filterEra = e.target.value; rerenderWithInputFocus('filter-era', e.target.selectionStart); });
  document.querySelectorAll('.domain-filters button').forEach(btn => btn.addEventListener('click', () => { filterDomain = btn.getAttribute('data-domain') || 'all'; render(); }));
  document.getElementById('filter-class')?.addEventListener('input', e => { filterClass = e.target.value; rerenderWithInputFocus('filter-class', e.target.selectionStart); });
  document.getElementById('filter-note-date')?.addEventListener('input', e => { filterNoteDate = e.target.value || ''; render(); });
  document.getElementById('filter-location')?.addEventListener('input', e => { filterLocation = e.target.value; rerenderWithInputFocus('filter-location', e.target.selectionStart); });
  document.getElementById('filter-subject')?.addEventListener('input', e => { filterSubject = e.target.value; rerenderWithInputFocus('filter-subject', e.target.selectionStart); });
  document.querySelectorAll('#note-list button[data-id]').forEach(btn => btn.addEventListener('click', () => { selectedId = btn.getAttribute('data-id'); saveFlash = false; editorEditing = false; render(); }));

  document.getElementById('new-note')?.addEventListener('click', () => {
    const id = uid();
    const domain = filterDomain === 'all' ? 'general' : filterDomain;
    upsertNote({ id, title: '', body: '', domain, class: '', era: '', location: '', subject: '', tags: [], noteDate: new Date().toISOString().slice(0, 10) });
    selectedId = id; saveFlash = false; editorEditing = true; render();
    queueMicrotask(() => document.getElementById('title')?.focus());
  });
  document.getElementById('editor-edit')?.addEventListener('click', () => { editorEditing = !editorEditing; render(); });
  document.getElementById('editor-save')?.addEventListener('click', () => { persistFromEditor(); editorEditing = false; render(); });

  document.getElementById('export')?.addEventListener('click', () => exportJson());
  document.getElementById('import')?.addEventListener('click', () => document.getElementById('import-file')?.click());
  document.getElementById('import-file')?.addEventListener('change', async e => { const f = e.target.files?.[0]; if (f) await importJson(f); e.target.value = ''; });

  const titleEl = document.getElementById('title');
  const domainEl = document.getElementById('domain');
  const classEl = document.getElementById('note-class');
  const eraEl = document.getElementById('era');
  const locationEl = document.getElementById('location');
  const subjectEl = document.getElementById('subject');
  const tagsEl = document.getElementById('tags');
  const noteDateEl = document.getElementById('note-date');
  const bodyEl = document.getElementById('body');
  if (bodyEl && current && !current.hasPdf) bodyEl.value = current.body;
  if (current?.hasPdf) {
    if (lastPdfObjectUrl) { URL.revokeObjectURL(lastPdfObjectUrl); lastPdfObjectUrl = null; }
    getPdf(current.id).then(blob => {
      if (!blob || selectedId !== current.id) return;
      const url = URL.createObjectURL(blob);
      lastPdfObjectUrl = url;
      const embed = document.getElementById('pdf-embed');
      const loading = document.getElementById('pdf-loading');
      if (embed) { embed.src = url; embed.style.display = 'block'; }
      if (loading) loading.style.display = 'none';
    });
  }

  function persistFromEditor() {
    if (!current || !titleEl || !domainEl) return;
    const d = domainEl.value;
    const patch = { id: current.id, title: titleEl.value, domain: d, class: classEl?.value ?? '', tags: parseTags(tagsEl?.value ?? ''), noteDate: noteDateEl?.value ?? '' };
    if (bodyEl) patch.body = bodyEl.value;
    if (d === 'history') { patch.era = eraEl?.value ?? ''; patch.location = locationEl?.value ?? ''; }
    if (d === 'geoscience') patch.subject = subjectEl?.value ?? '';
    upsertNote(patch);
    saveFlash = true;
    const hint = document.querySelector('.saved-hint');
    if (hint) hint.textContent = 'Saved.';
  }

  function onMaybeLeaveEditor() {
    requestAnimationFrame(() => {
      const a = document.activeElement;
      if (a && a.closest('.main')) return;
      render();
    });
  }

  [titleEl, classEl, eraEl, locationEl, subjectEl, tagsEl, bodyEl, noteDateEl].filter(Boolean).forEach(el => { el.addEventListener('input', () => { if (editorEditing) persistFromEditor(); }); el.addEventListener('change', () => { if (editorEditing) persistFromEditor(); }); el.addEventListener('blur', onMaybeLeaveEditor); });
  domainEl?.addEventListener('change', () => { if (editorEditing) { persistFromEditor(); render(); } });

  document.getElementById('del')?.addEventListener('click', async () => {
    if (!current) return;
    if (confirm('Delete this note?')) { await deleteNote(current.id); saveFlash = false; render(); }
  });
}

render();
void bootstrapCloudNotes();
})();
  </script>
</body>
</html>
